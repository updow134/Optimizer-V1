name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Codigo
        uses: actions/checkout@v4

      - name: Preparar arquivos do projeto
        run: |
          if [ -f "OptimizerApp.zip" ]; then
            unzip -o OptimizerApp.zip
          fi
          if [ -f "app.zip" ]; then
            unzip -o app.zip
          fi
          if [ -f "gradle.zip" ]; then
            unzip -o gradle.zip
          fi
          if [ -d "OptimizerApp" ] && [ ! -f "settings.gradle.kts" ]; then
            cp -rf OptimizerApp/. .
            rm -rf OptimizerApp
          fi
          ls -la

      - name: Configurar o JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Compilar o APK
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --no-daemon --stacktrace
          else
            sudo apt-get update && sudo apt-get install -y gradle
            gradle assembleDebug --no-daemon --stacktrace
          fi

      - name: Salvar o APK gerado
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
