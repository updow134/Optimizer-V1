name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Extrair pacotes zip
        shell: bash
        run: |
          for z in app.zip gradle.zip; do
            if [ -f "$z" ]; then unzip -oq "$z"; fi
          done

      - name: Configurar o JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Configurar o Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Compilar APK
        shell: bash
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --console=plain 2>&1 | tee build.log

      - name: Resumo dos erros
        if: failure()
        shell: bash
        run: |
          {
            echo '### Erros de compilação'
            echo '```'
            grep -E '^e: |What went wrong' -A2 build.log | head -n 60 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Salvar o APK gerado
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk