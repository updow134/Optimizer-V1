name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Codigo
        uses: actions/checkout@v4

      - name: Extrair pacotes zip
        run: |
          [ -f "app.zip" ] && unzip -o app.zip
          [ -f "gradle.zip" ] && unzip -o gradle.zip
          [ -f "OptimizerApp.zip" ] && unzip -o OptimizerApp.zip

      - name: Configurar o JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Compilar APK com Gradle do Sistema
        run: |
          sudo apt-get update && sudo apt-get install -y gradle
          gradle assembleDebug --no-daemon

      - name: Salvar o APK gerado
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
