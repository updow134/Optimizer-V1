name: Build Android APK
​on:
push:
branches: [ "main", "master" ]
workflow_dispatch:
​jobs:
build:
runs-on: ubuntu-latest
​steps:
- name: Checkout do Código
uses: actions/checkout@v4
​- name: Descompactar pastas zipadas
run: |
if [ -f "app.zip" ]; then unzip -o app.zip; fi
if [ -f "gradle.zip" ]; then unzip -o gradle.zip; fi
​- name: Configurar o JDK 17
uses: actions/setup-java@v5
with:
distribution: 'temurin'
java-version: '17'
​- name: Dar permissao ao Gradle Wrapper ou instalar Gradle
run: |
if [ -f "gradlew" ]; then
chmod +x gradlew
./gradlew assembleDebug --stacktrace
else
sudo apt-get update && sudo apt-get install -y gradle
gradle assembleDebug --stacktrace
fi
​- name: Salvar o APK gerado
uses: actions/upload-artifact@v4
with:
name: app-debug-apk
path: app/build/outputs/apk/debug/app-debug.apk